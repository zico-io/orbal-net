[package]
name = "orbal-net"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Per-mission agent coordination: one binary, client + server, over JSON/HTTP."
license = "MIT OR Apache-2.0"
repository = "https://github.com/zico-io/orbal-net"
readme = "README.md"
keywords = ["agent", "coordination", "multi-agent", "cli", "orchestration"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "orbal-net"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.29"

[profile.release]
strip = true
opt-level = "z"
lto = true
