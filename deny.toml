[advisories]
# RUSTSEC-2024-0436: paste v1.0.15 is unmaintained (not a vuln); pulled
# transitively via ratatui; no safe upgrade; pre-existing on .botfiles/comms
# main; tracked to remove when ratatui drops the dep.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
