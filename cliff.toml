# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# Owned by worker-changelog: this file is the single source of truth for
# both CHANGELOG.md and the GitHub Release notes release-plz generates.
# release-plz.toml (owned by the release automation) only references this
# file's path - the grouping contract lives here.

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{%- set repo_url = "https://github.com/zico-io/orbal-net" -%}
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                {{ repo_url }}/compare/{{ release.previous.version }}..{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                {{ repo_url }}/tree/{{ release.version }}
        {% endif -%}
    {% else -%}
        [Unreleased]: {{ repo_url }}/compare/{{ release.previous.version }}..HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
split_commits = false

# Section/naming contract (decided by release-lead) - order below is the
# render order. The "<!-- N -->" prefixes force group_by's sort order and
# are stripped by the `striptags` filter in the body template above.
#
# breaking (`!` or BREAKING CHANGE footer) -> Breaking Changes  (checked
#   first, via the top-level `breaking` bool every conventional commit is
#   parsed into, so it wins regardless of type)
# feat                                     -> Added
# fix                                      -> Fixed
# perf                                     -> Performance
# refactor                                 -> Changed
# docs                                     -> Documentation
# deps / build(deps) / chore(deps)         -> Dependencies
# security                                 -> Security
# revert                                   -> Reverted
# chore, ci, test, style, build (non-deps) -> hidden (skipped)
commit_parsers = [
    { field = "breaking", pattern = "^true$", group = "<!-- 0 -->⚠ Breaking Changes" },
    { message = "^feat", group = "<!-- 1 -->Added" },
    { message = "^fix", group = "<!-- 2 -->Fixed" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = "^refactor", group = "<!-- 4 -->Changed" },
    { message = "^docs", group = "<!-- 5 -->Documentation" },
    { message = "^(deps|build\\(deps\\)|chore\\(deps\\))", group = "<!-- 6 -->Dependencies" },
    { message = "^security", group = "<!-- 7 -->Security" },
    { message = "^revert", group = "<!-- 8 -->Reverted" },
    { message = "^(chore|ci|test|style|build)", skip = true },
]
filter_commits = true
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
